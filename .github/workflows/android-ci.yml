name: Android CI

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # google-services.json 없이도 build가 성공하도록 이미 app/build.gradle.kts가
      # 조건부로 처리한다(파일 없으면 FCM plugin만 건너뜀). CI에는 넣지 않는다.
      # GILPICK_API_BASE_URL 등은 gradle.properties에 CI-safe 기본값이 커밋돼 있어
      # 별도 -P 주입이 필요 없다. Naver Maps client ID가 없어 지도 초기화 관련
      # 코드는 빌드만 되고 동작 검증은 되지 않는다.
      - name: 필요한 SDK platform license 동의
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Debug build
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
          retention-days: 7
