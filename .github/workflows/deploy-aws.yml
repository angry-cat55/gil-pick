name: Deploy to AWS (dev)

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'deploy/aws/**'
  workflow_dispatch:
    inputs:
      confirm:
        description: '실서버에 배포합니다. 계속하려면 정확히 "deploy"를 입력하세요.'
        required: true

concurrency:
  group: deploy-aws-dev
  cancel-in-progress: false

jobs:
  deploy:
    # AWS EC2에 직접 설치한 self-hosted runner에서 실행한다(docs/deployment/aws-dev.md 5-1절).
    # EC2 SSH 22는 담당자 IP로만 열려 있어 GitHub 호스팅 runner에서 SSH 접속이
    # 막히므로, 서버 안에서 직접 도는 self-hosted runner로 SSH를 아예 없앴다.
    runs-on: [self-hosted, aws-dev]
    steps:
      - name: 확인 문자열 검증
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "deploy" ]; then
            echo "::error::confirm 입력이 'deploy'가 아닙니다. 배포를 중단합니다."
            exit 1
          fi

      # self-hosted runner가 이미 EC2 위에서 도니까 actions/checkout으로 별도
      # 작업 디렉터리를 만들지 않는다. docs/deployment/aws-dev.md가 정의한
      # 기존 배포 경로(/opt/gilpick/repository)를 그대로 갱신한다.
      - name: 배포 (migration → build → 재기동)
        run: |
          set -euo pipefail
          cd /opt/gilpick/repository
          git fetch origin
          git checkout main
          git pull --ff-only origin main
          docker compose -f deploy/aws/compose.yaml run --rm api .venv/bin/alembic upgrade head
          docker compose -f deploy/aws/compose.yaml up -d --build

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl --fail -s https://gilpick-api.duckdns.org/health; then
              echo
              echo "healthy"
              exit 0
            fi
            sleep 5
          done
          echo "::error::배포 후 health check가 10회 모두 실패했습니다. 'docker compose -f deploy/aws/compose.yaml logs api'로 원인을 확인하세요. 자동 rollback은 수행하지 않습니다."
          exit 1

      - name: 배포된 migration 확인
        if: success()
        run: |
          cd /opt/gilpick/repository
          docker compose -f deploy/aws/compose.yaml run --rm api .venv/bin/alembic current
