org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# App Link host (비밀값 아님). 팀이 확정한 공모전 제출용 host다.
# assetlinks.json을 이 host의 /.well-known/ 경로에 배포해야 App Link 검증이 통과한다.
# 다른 host로 시험할 때는 -P 또는 CI 환경변수로 덮어쓴다.
GILPICK_ANDROID_APP_LINK_HOST=gilpick.pages.dev
GILPICK_API_BASE_URL=https://api.gilpick.example/api/v1/
