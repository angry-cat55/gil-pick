[project]
name = "gilpick-api"
version = "0.1.0"
description = "길픽 REST API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.16.5",
    "asyncpg==0.30.0",
    "fastapi==0.141.1",
    "geoalchemy2>=0.18,<0.19",
    "pydantic-settings==2.10.1",
    "pyjwt==2.10.1",
    "sqlalchemy[asyncio]==2.0.52",
    "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
    "httpx2==2.10.0",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
