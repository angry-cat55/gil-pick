openapi: 3.1.0
info:
  title: 길픽 F011 알림 계약
  version: 0.1.0
  description: |
    F011이 추가하는 endpoint(NOTI-001~NOTI-003, DEV-001, DEV-002). 공통 응답 봉투
    (`success`·`data`·`meta.requestId`)와 오류 형식은 `docs/design/api-spec.md` 1절을 따른다.
    시각은 ISO-8601 `+09:00`.

    NOTI-003(모두 읽음)은 api-spec 초안에 없던 신설이다(research R8, Figma NotificationsScreen
    헤더 버튼·spec FR-014). api-spec 2·9절을 이 계약으로 동기화한다.

    PREF-001·PREF-002(`/users/me/preferences`)는 F012 범위이며 이 계약에 포함하지 않는다.
    F011은 `users.replacement_suggestion_enabled`를 발송 시 읽기만 한다(spec Clarifications 2026-09-10).

    FCM 전달 payload는 이 HTTP 계약이 아니라 data-model.md 3.2에 정의한다(재조회 식별자 + 짧은 문구만).
servers:
  - url: /api/v1
security:
  - bearerAuth: []

paths:
  /notifications:
    get:
      operationId: list_notifications
      summary: NOTI-001 알림 목록 조회
      description: |
        인증 사용자의 알림을 최신순으로 cursor 페이지네이션한다. 생성 후 90일이 지난 알림은
        제외한다(spec FR-030). `read`가 오면 읽음/안 읽음만 반환한다.
        대상(여행·감지·전환)이 논리 삭제·무효화돼도 이 조회는 실패하지 않는다(FR-016).
      parameters:
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: read
          in: query
          required: false
          description: true=읽은 알림만, false=안 읽은 알림만, 생략=전체
          schema: { type: boolean }
      responses:
        '200':
          description: 알림 목록
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/NotificationItem' }
                  meta: { $ref: '#/components/schemas/PaginatedMeta' }
        '401': { $ref: '#/components/responses/Error' }

  /notifications/{notificationId}/read:
    patch:
      operationId: mark_notification_read
      summary: NOTI-002 알림 읽음 처리
      description: 한 건을 읽음으로 만든다. 이미 읽음이면 그대로 성공을 반환한다(멱등).
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: 읽음 처리됨
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [notificationId, read]
                    properties:
                      notificationId: { type: string, format: uuid }
                      read: { const: true }
                  meta: { $ref: '#/components/schemas/ResponseMeta' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /notifications/read-all:
    patch:
      operationId: mark_all_notifications_read
      summary: NOTI-003 모든 알림 읽음 처리 (신설)
      description: 인증 사용자의 안 읽은 알림을 모두 읽음으로 만든다. 멱등(0건이면 updated=0).
      responses:
        '200':
          description: 일괄 읽음 처리됨
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [updated]
                    properties:
                      updated: { type: integer, minimum: 0 }
                  meta: { $ref: '#/components/schemas/ResponseMeta' }
        '401': { $ref: '#/components/responses/Error' }

  /devices/fcm-token:
    put:
      operationId: register_fcm_token
      summary: DEV-001 FCM 토큰 등록·갱신
      description: |
        인증 사용자의 활성 기기 세션(`client_device_id == deviceId`)에 FCM 토큰을 저장한다.
        PUT이라 멱등이며 같은 기기의 재등록은 이전 값을 대체한다(spec FR-010).
        같은 토큰이 다른 세션에 있으면 그 세션 값을 먼저 비운다(토큰 이동).
        해당 기기의 활성 세션이 없으면 `404 DEVICE_SESSION_NOT_FOUND`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, fcmToken, platform]
              properties:
                deviceId: { type: string, maxLength: 255 }
                fcmToken: { type: string, minLength: 1 }
                platform: { type: string, enum: [ANDROID] }
      responses:
        '200':
          description: 등록됨
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [deviceId, registered]
                    properties:
                      deviceId: { type: string }
                      registered: { const: true }
                  meta: { $ref: '#/components/schemas/ResponseMeta' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /devices/{deviceId}/fcm-token:
    delete:
      operationId: unregister_fcm_token
      summary: DEV-002 FCM 토큰 해제
      description: |
        해당 기기 세션의 FCM 토큰을 비운다. 이후 그 기기는 발송 대상에서 빠진다(spec FR-011).
        로그아웃(AUTH-005)도 같은 세션의 토큰을 비우므로, 앱이 이 요청을 못 보내도 정리된다.
        멱등(이미 비어 있어도 204).
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, maxLength: 255 }
      responses:
        '204': { description: 해제됨 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    NotificationType:
      type: string
      enum:
        - PLACE_CHANGE_SUGGESTION
        - ARRIVAL_CHECK
        - DEPARTURE_CHECK
        - ARRIVAL_AUTO_CONFIRMED
        - DEPARTURE_AUTO_CONFIRMED

    NotificationItem:
      type: object
      required: [notificationId, type, tripId, title, body, read, createdAt]
      properties:
        notificationId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/NotificationType' }
        tripId: { type: string, format: uuid }
        tripDayId: { type: string, format: uuid, description: 도착·출발·자동·재질문에만 존재 }
        itemId: { type: string, format: uuid, description: 도착·출발·자동·재질문에만 존재 }
        detectionId: { type: string, format: uuid, description: PLACE_CHANGE_SUGGESTION에만 존재 }
        transitionId: { type: string, format: uuid, description: 도착·출발·자동·재질문에만 존재 }
        title: { type: string, maxLength: 200 }
        body: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }

    ResponseMeta:
      type: object
      required: [requestId]
      properties:
        requestId: { type: string, format: uuid }

    PaginatedMeta:
      type: object
      required: [pagination, requestId]
      properties:
        requestId: { type: string, format: uuid }
        pagination:
          type: object
          required: [nextCursor, hasNext]
          properties:
            nextCursor: { type: [string, 'null'] }
            hasNext: { type: boolean }

    ErrorBody:
      type: object
      required: [success, error, meta]
      properties:
        success: { const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
        meta: { $ref: '#/components/schemas/ResponseMeta' }

  responses:
    Error:
      description: 공통 오류 응답 (api-spec 1.2절)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
