openapi: 3.1.0
info:
  title: 길픽 여행 관리 API
  version: 1.2.0
  description: F002 여행 생성·조회·수정·삭제와 목록 검색·필터 계약. 상위 `docs/design/api-spec.md` 1.2.0의 여행(TRIP) subset이다. `days[]`는 F004(일정)·F005(경로)가 실제 데이터를 채우기 전까지 생략한다(research.md 3절).
servers:
  - url: https://{apiHost}/api/v1
    variables:
      apiHost:
        default: api.gilpick.example
security:
  - bearerAuth: []

paths:
  /trips:
    get:
      operationId: listTrips
      summary: 여행 목록 조회·검색·필터
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: 여행명 부분 검색
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TripStatus'
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 여행 목록 (여행 중 → 예정 → 완료 그룹 순)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createTrip
      summary: 여행 생성
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '201':
          description: 여행 생성 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: 여행명 또는 기간 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /trips/{tripId}:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getTrip
      summary: 여행 상세 조회
      responses:
        '200':
          description: 여행 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateTrip
      summary: 여행 이름·기간 수정
      description: >-
        완료(`COMPLETED`) 상태 여행은 `name`만 수정할 수 있다. `startDate`/`endDate` 변경 시도는
        `409 TRIP_LOCKED`로 거부한다. 기간 축소로 범위 밖에 놓이는 일정이 있으면
        `confirmDeleteOutOfRangeItems: true` 없이는 `409 CONFIRMATION_REQUIRED`를 반환한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTripRequest'
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 버전 충돌, 완료 여행 기간 잠금, 삭제 확인 필요 중 하나
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 여행명 또는 기간 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: deleteTrip
      summary: 여행 논리 삭제
      description: >-
        상태와 무관하게 소유한 여행을 논리 삭제한다. 이미 삭제된 여행에 대한 반복 요청은
        부작용 없이 `204`를 반환한다(멱등).
      responses:
        '204':
          description: 삭제 완료 (또는 이미 삭제된 상태 유지)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TripStatus:
      type: string
      enum: [UPCOMING, IN_PROGRESS, COMPLETED]

    Trip:
      type: object
      required: [tripId, name, startDate, endDate, status, dayCount, version]
      properties:
        tripId:
          type: string
          format: uuid
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/TripStatus'
        dayCount:
          type: integer
          description: 'endDate - startDate + 1'
        version:
          type: integer
        createdAt:
          type: string
          format: date-time

    TripEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/Trip'
        meta:
          $ref: '#/components/schemas/Meta'

    TripListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Trip'
        meta:
          type: object
          required: [pagination, requestId]
          properties:
            pagination:
              type: object
              required: [nextCursor, hasNext]
              properties:
                nextCursor:
                  type: string
                  nullable: true
                hasNext:
                  type: boolean
            requestId:
              type: string
              format: uuid

    Meta:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
          format: uuid

    CreateTripRequest:
      type: object
      required: [name, startDate, endDate]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 30
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    UpdateTripRequest:
      type: object
      required: [version]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 30
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        version:
          type: integer
          description: 클라이언트가 조회했던 여행의 현재 버전
        confirmDeleteOutOfRangeItems:
          type: boolean
          default: false
          description: 기간 축소로 범위 밖 일정이 삭제됨을 사용자가 확인했는지 여부

    ErrorEnvelope:
      type: object
      required: [success, error, meta]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
              enum:
                - INVALID_REQUEST
                - INVALID_ACCESS_TOKEN
                - VALIDATION_ERROR
                - INVALID_TRIP_PERIOD
                - TRIP_NOT_FOUND
                - TRIP_LOCKED
                - VERSION_CONFLICT
                - CONFIRMATION_REQUIRED
                - FORBIDDEN
            message:
              type: string
            details:
              type: object
            retryable:
              type: boolean
        meta:
          $ref: '#/components/schemas/Meta'

  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 소유권 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 존재하지 않거나 이미 삭제된 여행
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
