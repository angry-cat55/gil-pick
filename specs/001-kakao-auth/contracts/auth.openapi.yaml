openapi: 3.1.0
info:
  title: 길픽 카카오 인증 API
  version: 1.2.0
  description: F001 카카오 로그인, Token 갱신과 현재 기기 로그아웃 계약. 상위 `docs/design/api-spec.md` 1.2.0의 인증 subset이다.
servers:
  - url: https://{apiHost}/api/v1
    variables:
      apiHost:
        default: api.gilpick.example
security: []

paths:
  /auth/kakao/transactions:
    post:
      operationId: createKakaoLoginTransaction
      summary: 카카오 로그인 transaction 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLoginTransactionRequest'
      responses:
        '201':
          description: 로그인 transaction 생성 완료
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/NoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginTransactionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/kakao/callback:
    get:
      operationId: handleKakaoLoginCallback
      summary: 카카오 인가 결과 처리
      description: >-
        JSON API가 아니라 Kakao에서 호출하는 HTTPS callback이다. code와 error 중 정확히 하나만 있어야 하며
        error_description은 error와 함께만 허용한다. 신뢰 가능한 transaction을 찾은 뒤에는 성공과 provider 실패를
        Android verified App Link로 redirect하고, transaction을 확인할 수 없는 callback만 일반 400으로 종료한다.
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: >-
            성공 시 URI fragment로 120초 유효 login ticket을 전달한다. 실패 시 query의 error에
            ACCESS_DENIED, INVALID_AUTHORIZATION_CODE, KAKAO_AUTH_FAILED, KAKAO_RATE_LIMITED,
            KAKAO_API_FAILED, KAKAO_API_TIMEOUT, LOGIN_TRANSACTION_EXPIRED 중 하나를 전달한다.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
              examples:
                success:
                  value: https://app.gilpick.example/auth/kakao/complete#loginTicket=transaction-id.secret
                failure:
                  value: https://app.gilpick.example/auth/kakao/complete?error=KAKAO_AUTH_FAILED
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '400':
          description: App Link redirect 자체를 만들 수 없는 잘못된 callback. 민감정보가 없는 일반 text만 반환한다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
          content:
            text/plain:
              schema:
                type: string
                const: Invalid callback

  /auth/kakao/exchange:
    post:
      operationId: exchangeKakaoLoginTicket
      summary: 일회용 login ticket 교환
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginTicketExchangeRequest'
      responses:
        '200':
          description: 기존 사용자 로그인 성공
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/NoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '201':
          description: 신규 사용자 로그인 성공
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/NoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: "`INVALID_LOGIN_TICKET` 또는 `LOGIN_TICKET_EXPIRED`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: "`DEVICE_MISMATCH`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/token/refresh:
    post:
      operationId: refreshAuthTokens
      summary: Access·Refresh Token 회전
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token 회전 성공
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/NoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: "`TOKEN_EXPIRED` 또는 `INVALID_REFRESH_TOKEN`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: "`DEVICE_MISMATCH`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      operationId: logoutCurrentDevice
      summary: 현재 기기 Refresh Token 폐기
      description: 같은 device와 Token으로 반복한 요청은 멱등하게 204를 반환한다. Bearer Access Token 없이 durable retry할 수 있다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: 현재 기기 logout 완료 또는 이미 같은 자격으로 완료됨
        '401':
          description: "`INVALID_REFRESH_TOKEN`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: "`DEVICE_MISMATCH`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  schemas:
    DeviceId:
      type: string
      format: uuid

    CreateLoginTransactionRequest:
      type: object
      additionalProperties: false
      required: [deviceId, platform]
      properties:
        deviceId:
          $ref: '#/components/schemas/DeviceId'
        platform:
          type: string
          const: ANDROID

    LoginTicketExchangeRequest:
      type: object
      additionalProperties: false
      required: [loginTicket, deviceId]
      properties:
        loginTicket:
          $ref: '#/components/schemas/OpaqueSelectorToken'
        deviceId:
          $ref: '#/components/schemas/DeviceId'

    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken, deviceId]
      properties:
        refreshToken:
          $ref: '#/components/schemas/OpaqueSelectorToken'
        deviceId:
          $ref: '#/components/schemas/DeviceId'

    LogoutRequest:
      $ref: '#/components/schemas/RefreshTokenRequest'

    UserSummary:
      type: object
      additionalProperties: false
      required: [userId, provider]
      properties:
        userId:
          type: string
          format: uuid
        nickname:
          type: [string, 'null']
          maxLength: 80
        profileImageUrl:
          type: [string, 'null']
          format: uri
          pattern: '^https://'
        provider:
          type: string
          const: KAKAO

    LoginTransactionData:
      type: object
      additionalProperties: false
      required: [transactionId, authorizationUrl, expiresIn]
      properties:
        transactionId:
          type: string
          format: uuid
        authorizationUrl:
          type: string
          format: uri
          pattern: '^https://'
        expiresIn:
          type: integer
          const: 600

    AuthTokenData:
      type: object
      additionalProperties: false
      required: [accessToken, expiresIn, refreshToken, refreshExpiresIn, user]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          const: 3600
        refreshToken:
          $ref: '#/components/schemas/OpaqueSelectorToken'
        refreshExpiresIn:
          type: integer
          const: 2592000
        user:
          $ref: '#/components/schemas/UserSummary'

    RefreshTokenData:
      type: object
      additionalProperties: false
      required: [accessToken, expiresIn, refreshToken, refreshExpiresIn]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          const: 3600
        refreshToken:
          $ref: '#/components/schemas/OpaqueSelectorToken'
        refreshExpiresIn:
          type: integer
          const: 2592000

    ResponseMeta:
      type: object
      additionalProperties: false
      required: [requestId]
      properties:
        requestId:
          type: string
          format: uuid

    LoginTransactionResponse:
      type: object
      additionalProperties: false
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/LoginTransactionData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    AuthTokenResponse:
      type: object
      additionalProperties: false
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/AuthTokenData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    RefreshTokenResponse:
      type: object
      additionalProperties: false
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/RefreshTokenData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message, details, retryable]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
        retryable:
          type: boolean

    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [success, error, meta]
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/ErrorBody'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    OpaqueSelectorToken:
      type: string
      minLength: 80
      maxLength: 80
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}\.[A-Za-z0-9_-]{43}$'
      description: UUID selector와 점, 256-bit base64url secret으로 구성된 opaque 자격

  headers:
    NoStore:
      description: 민감 응답의 저장 금지
      schema:
        type: string
        const: no-store
    NoCache:
      description: HTTP/1.0 호환 cache 방지
      schema:
        type: string
        const: no-cache
    NoReferrer:
      description: callback redirect referrer 전송 금지
      schema:
        type: string
        const: no-referrer

  responses:
    BadRequest:
      description: "`INVALID_REQUEST`"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: "`INTERNAL_ERROR`"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
