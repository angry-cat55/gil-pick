openapi: 3.1.0
info:
  title: 길픽 F008 여행 변수 감지 계약
  version: 0.1.0
  description: |
    감지 결과 목록 조회(DETECT-001), 상세 조회(DETECT-002), 읽음 처리(DETECT-003).
    `docs/design/api-spec.md` §7의 경로·메서드를 유지하되, `status` enum을
    `docs/design/er-schema.md` §10(ACTIVE·RESOLVED·DISMISSED·INVALIDATED)에 맞추고
    상세 응답의 변수 판정에 visitBlocked·precipitationType·sensitivity를 더한다.
    이 차이는 구현 PR과 같은 PR에서 api-spec.md §7에 반영한다.

    감지 결과의 생성·갱신·종료는 서버가 10분 주기 작업과 ETA 재계산 직후 재평가로 수행하며
    이 계약에는 조회·읽음만 있다. 대체 장소 추천(F009), 일정 변경(F010),
    푸시 알림·인앱 배너(F011)는 범위 밖이다.

    모든 요청은 인증이 필요하고 대상 여행/감지의 소유권을 검증한다.
    시각은 모두 `Asia/Seoul` offset을 포함한 ISO-8601 문자열이다.
servers:
  - url: /api/v1
paths:
  /trips/{tripId}/detections:
    get:
      operationId: listDetections
      summary: 감지 결과 목록 조회 (DETECT-001)
      description: |
        대상 여행의 감지 결과를 최신순(detected_at 내림차순)으로 cursor 페이지네이션한다.
        상태와 무관하게 모두 반환하며 앱이 필요하면 status로 거른다.
        cursor는 이전 응답 meta.pagination.nextCursor 값을 그대로 전달한다.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TripId'
        - name: cursor
          in: query
          required: false
          description: 이전 페이지 응답의 nextCursor. 첫 페이지는 생략한다
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: 페이지 크기. 기본 20, 최대 50
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: 감지 결과 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetectionListEnvelope' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /detections/{detectionId}:
    get:
      operationId: getDetection
      summary: 감지 결과 상세 조회 (DETECT-002)
      description: |
        기준 ETA, 변수별 사용 가능 여부와 판정, 상태, 읽음 여부를 반환한다.
        변수 내용은 마지막 재평가 값이다.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DetectionId'
      responses:
        '200':
          description: 감지 결과 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetectionDetailEnvelope' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /detections/{detectionId}/read:
    patch:
      operationId: markDetectionRead
      summary: 감지 결과 읽음 처리 (DETECT-003)
      description: |
        read_at을 서버 시각으로 채운다. 이미 읽음이면 그대로 200을 돌려준다(멱등).
        상태(ACTIVE·RESOLVED·DISMISSED·INVALIDATED)와 무관하게 읽음 처리할 수 있다.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DetectionId'
      responses:
        '200':
          description: 읽음 처리 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetectionReadEnvelope' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DetectionId:
      name: detectionId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    DetectionStatus:
      type: string
      enum: [ACTIVE, RESOLVED, DISMISSED, INVALIDATED]
      description: |
        ACTIVE=사용자 결정 전(pending). RESOLVED·DISMISSED=F009·F010 변경 승인·거절.
        INVALIDATED=대상 장소 완료·건너뜀·제거 또는 당일 완료로 종료.
    DetectionType:
      type: string
      enum: [CONGESTION, WEATHER, OPERATING_HOURS]
    UnavailableReason:
      type: string
      enum: [NO_FORECAST, NOT_IN_SUPPORT_AREA, HOURS_UNKNOWN, INDOOR, TIMEOUT]
    DetectionListEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/DetectionListData' }
        meta: { $ref: '#/components/schemas/PaginatedMeta' }
    DetectionListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DetectionListItem' }
    DetectionListItem:
      type: object
      required: [detectionId, itemId, placeName, primaryType, status, totalRiskScore, createdAt, read]
      properties:
        detectionId: { type: string, format: uuid }
        itemId:
          type: string
          format: uuid
          description: 감지 대상 일정 항목
        placeName:
          type: string
          description: 대상 장소명(places.name 스냅샷)
        primaryType:
          allOf: [{ $ref: '#/components/schemas/DetectionType' }]
          description: 종합 점수 기여가 가장 큰 변수
        status: { $ref: '#/components/schemas/DetectionStatus' }
        totalRiskScore:
          type: integer
          minimum: 0
          maximum: 100
          description: round(score*100). 표시·정렬용이며 감지 생성 기준이 아니다(FR-011·FR-012)
        createdAt:
          type: string
          format: date-time
          description: detected_at
        read:
          type: boolean
          description: read_at IS NOT NULL
    DetectionDetailEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/DetectionDetail' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    DetectionDetail:
      type: object
      required: [detectionId, tripId, itemId, placeName, primaryType, status, eta, totalRiskScore, reason, variables, read, createdAt, lastEvaluatedAt]
      properties:
        detectionId: { type: string, format: uuid }
        tripId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        placeName: { type: string }
        primaryType: { $ref: '#/components/schemas/DetectionType' }
        status: { $ref: '#/components/schemas/DetectionStatus' }
        eta:
          type: string
          format: date-time
          description: 평가 기준으로 삼은 도착 예정 시각
        totalRiskScore: { type: integer, minimum: 0, maximum: 100 }
        reason:
          type: string
          description: 사용자 표시 요약 문구
        variables:
          $ref: '#/components/schemas/VariableVerdicts'
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastEvaluatedAt:
          type: string
          format: date-time
          description: 마지막 재평가 시각
    VariableVerdicts:
      type: object
      required: [congestion, weather, operatingHours]
      properties:
        congestion: { $ref: '#/components/schemas/CongestionVerdict' }
        weather: { $ref: '#/components/schemas/WeatherVerdict' }
        operatingHours: { $ref: '#/components/schemas/OperatingHoursVerdict' }
    CongestionVerdict:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        unavailableReason:
          oneOf: [{ $ref: '#/components/schemas/UnavailableReason' }, { type: 'null' }]
          description: available=false일 때의 사유(NOT_IN_SUPPORT_AREA·NO_FORECAST·TIMEOUT). 아니면 null
        level:
          type: [string, 'null']
          enum: [RELAXED, NORMAL, SLIGHTLY_CROWDED, CROWDED, null]
          description: ETA 시점 혼잡 수준. available=false면 null
        sensitivity:
          type: [string, 'null']
          enum: [HIGH, MEDIUM, null]
          description: 카테고리 민감도. HIGH=쇼핑·음식·카페
        crowded:
          type: [boolean, 'null']
          description: 민감도 기준 혼잡 위험 판정. available=false면 null
    WeatherVerdict:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        unavailableReason:
          oneOf: [{ $ref: '#/components/schemas/UnavailableReason' }, { type: 'null' }]
          description: NO_FORECAST·INDOOR·TIMEOUT. 실내 장소는 예보가 있어도 INDOOR로 제외(SC-007)
        precipitationProbability:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: 강수확률(%). available=false면 null
        precipitationMmPerHour:
          type: [number, 'null']
          format: double
          minimum: 0
          description: 예상 강수량(mm/h)
        precipitationType:
          type: [string, 'null']
          enum: [NONE, RAIN, RAIN_SNOW, SNOW, SHOWER, null]
        atRisk:
          type: [boolean, 'null']
          description: POP≥70 또는 PCP≥1.0 또는 강수성 상태. available=false면 null
    OperatingHoursVerdict:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        unavailableReason:
          oneOf: [{ $ref: '#/components/schemas/UnavailableReason' }, { type: 'null' }]
          description: HOURS_UNKNOWN·TIMEOUT. 운영시간을 확인할 수 없으면 운영 중으로 가정하고 제외
        closesAt:
          type: [string, 'null']
          format: date-time
          description: ETA 요일의 폐점 시각. 확인 불가면 null
        closingSoon:
          type: [boolean, 'null']
          description: ETA가 폐점 30분 전 이내
        visitBlocked:
          type: [boolean, 'null']
          description: ETA가 폐점 시각 이후이거나 확인 가능한 임시·영구 휴업(FR-008)
        tempClosed:
          type: [boolean, 'null']
          description: businessStatus가 CLOSED_TEMPORARILY
    DetectionReadEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [detectionId, read]
          properties:
            detectionId: { type: string, format: uuid }
            read: { type: boolean, const: true }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    ResponseMeta:
      type: object
      required: [requestId]
      properties:
        requestId: { type: string, format: uuid }
    PaginatedMeta:
      type: object
      required: [pagination, requestId]
      properties:
        pagination:
          type: object
          required: [nextCursor, hasNext]
          properties:
            nextCursor:
              type: [string, 'null']
              description: 다음 페이지 cursor. 마지막 페이지면 null
            hasNext: { type: boolean }
        requestId: { type: string, format: uuid }
    ErrorEnvelope:
      type: object
      required: [success, error, meta]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, INVALID_ACCESS_TOKEN, TRIP_FORBIDDEN, TRIP_NOT_FOUND, DETECTION_NOT_FOUND, DETECTION_FORBIDDEN]
            message: { type: string }
            retryable: { type: boolean }
            details:
              type: [object, 'null']
              additionalProperties: true
        meta: { $ref: '#/components/schemas/ResponseMeta' }
  responses:
    Error:
      description: 오류 응답
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
