openapi: 3.1.0
info:
  title: 길픽 F010 일정 변경 계약
  version: 0.1.0
  description: |
    F010이 추가하는 endpoint(REPL-001~REPL-004)와 F006 PROG-001 응답 확장. 공통 응답 봉투
    (`success`·`data`·`meta.requestId`)와 오류 형식은 `docs/design/api-spec.md` 1절을 따른다.
    시각은 ISO-8601 `+09:00`, 거리는 m 단위 정수, 이동 시간은 초 단위 정수.

    일정 version 필드 이름은 F004 ITIN-002·F006 PROG-001과 같은 `scheduleVersion`을 쓴다.
    api-spec REPL-001 초안의 `itineraryVersion`은 이 계약으로 갱신한다(research 11절).

    경로 계산은 REPL-001에서 끝내고 REPL-002는 그 결과를 확정만 한다. 따라서 승인 요청에는
    외부 provider 호출이 없고 부분 성공 상태가 생기지 않는다(research 2절).
servers:
  - url: /api/v1
security:
  - bearerAuth: []

paths:
  /detections/{detectionId}/route-previews:
    post:
      operationId: createRoutePreview
      summary: REPL-001 변경 경로 미리보기 생성
      description: |
        감지 결과 하나와 대체 장소 하나로 변경 경로를 계산해 비교 결과를 만든다.
        **일정·경로·진행 상태·감지 결과를 바꾸지 않는다**(FR-001).

        같은 감지 결과에 이미 `PENDING` 미리보기가 있으면 그 미리보기는 `SUPERSEDED`가 되고
        더 이상 승인할 수 없다(FR-006).

        `candidateId`가 오면 F009가 발급한 후보 식별자로 검증한다. 직접 검색으로 고른 장소는
        `candidateId` 없이 `placeId`만 보낸다. 두 경우의 응답 형식은 같다(FR-004).
      parameters:
        - $ref: '#/components/parameters/DetectionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePreviewRequest' }
      responses:
        '200':
          description: 미리보기 생성 완료. 같은 `Idempotency-Key` 재요청은 첫 결과를 그대로 반환한다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutePreviewEnvelope' }
        '400':
          description: |
            `INVALID_CANDIDATE` 후보 식별자가 유효하지 않거나 만료됐거나 이 감지 결과의 것이 아님.
            `INVALID_REQUEST` 요청 형식 오류
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          description: '`TRIP_FORBIDDEN` 이 여행의 소유자가 아님'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '404':
          description: '`DETECTION_NOT_FOUND` 감지 결과 없음. `PLACE_NOT_FOUND` 대체 장소 없음'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: |
            `DETECTION_NOT_ACTIVE` 감지 결과가 이미 사용자 결정을 마침.
            `ITEM_ALREADY_VISITED` 대상 장소를 이미 방문하기 시작함.
            `PLACE_ALREADY_IN_SCHEDULE` 대체 장소가 그 날짜 일정에 이미 있음.
            `DAY_NOT_IN_PROGRESS` 진행 중인 날짜가 아님
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '502':
          description: '`ROUTE_PROVIDER_ERROR` 경로를 계산하지 못함. 일정은 그대로다(FR-007)'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '504':
          description: '`ROUTE_PROVIDER_TIMEOUT` 경로 계산 시간 초과. 일정은 그대로다'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /route-previews/{previewId}/approve:
    post:
      operationId: approveRoutePreview
      summary: REPL-002 대체 장소 승인
      description: |
        미리보기의 계산 결과를 확정한다. 일정 장소 교체·경로 확정·ETA 재계산·변경 이력 저장·
        감지 결과 종료를 **하나의 transaction**으로 처리한다(FR-008).

        승인 시점에 미리보기 유효 시간, 일정 version, 대상 항목 미방문 여부, 대체 장소 방문
        가능 여부, 감지 결과 상태를 다시 확인한다(FR-010). 하나라도 어긋나면 아무것도 바꾸지
        않고 원인별 오류를 반환한다.

        승인 후 `undoExpiresAt`까지 REPL-004로 되돌릴 수 있다.
      parameters:
        - $ref: '#/components/parameters/PreviewId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 승인 완료. 같은 `Idempotency-Key` 재요청은 첫 결과를 그대로 반환한다(FR-011)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplacementEnvelope' }
        '400':
          description: '`INVALID_REQUEST` 잘못된 `Idempotency-Key`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          description: '`TRIP_FORBIDDEN`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '404':
          description: '`PREVIEW_NOT_FOUND`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: |
            `PREVIEW_EXPIRED` 유효 시간이 지남.
            `PREVIEW_SUPERSEDED` 같은 감지 결과에 더 새 미리보기가 있음.
            `PREVIEW_REJECTED` 이미 거절한 미리보기.
            `ALREADY_APPROVED` 이미 승인함(같은 `Idempotency-Key`가 아닌 재요청).
            `VERSION_CONFLICT` 미리보기 생성 이후 그 날짜 일정이 바뀜.
            `ITEM_ALREADY_VISITED` 대상 장소를 이미 방문하기 시작함.
            `ALTERNATIVE_UNAVAILABLE` 대체 장소를 더 이상 방문할 수 없음.
            `DETECTION_NOT_ACTIVE` 감지 결과가 이미 사용자 결정을 마침
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /route-previews/{previewId}/reject:
    post:
      operationId: rejectRoutePreview
      summary: REPL-003 미리보기 폐기
      description: |
        미리보기를 폐기한다. 기존 일정·경로·감지 결과는 바꾸지 않는다. 사용자는 같은 감지
        결과의 후보 목록으로 돌아가 다른 후보를 고를 수 있다(UI-003).

        F009의 감지 거절(DETECT-004)과 다르다. 그쪽은 "기존 일정 그대로 진행"이라는 사용자
        결정이고 이쪽은 미리보기 하나만 버린다.

        이미 폐기했거나 `SUPERSEDED`인 미리보기에 다시 요청해도 `204`다(자연 멱등).
      parameters:
        - $ref: '#/components/parameters/PreviewId'
      responses:
        '204': { description: 폐기 완료 }
        '403':
          description: '`TRIP_FORBIDDEN`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '404':
          description: '`PREVIEW_NOT_FOUND`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: '`ALREADY_APPROVED` 이미 승인한 미리보기는 폐기할 수 없다'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /replacements/{replacementId}/undo:
    post:
      operationId: undoReplacement
      summary: REPL-004 장소 변경 되돌리기
      description: |
        승인으로 바뀐 장소와 경로를 승인 전 상태로 복원한다. 장소 복원·경로 복원·ETA
        재계산·감지 결과 복귀를 하나의 transaction으로 처리한다(FR-016).

        되돌릴 수 있는 조건은 세 가지를 모두 만족할 때다.
        아직 되돌리지 않았고, 서버 시각이 `undoExpiresAt` 이전이며, 승인 이후 그 날짜 일정이
        바뀌지 않았다(FR-017).

        이미 되돌린 변경에 다시 요청하면 오류가 아니라 이미 되돌아간 상태를 그대로 반환한다.
      parameters:
        - $ref: '#/components/parameters/ReplacementId'
      responses:
        '200':
          description: 되돌리기 완료 또는 이미 되돌아간 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UndoEnvelope' }
        '403':
          description: '`TRIP_FORBIDDEN`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '404':
          description: '`REPLACEMENT_NOT_FOUND`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: |
            `UNDO_EXPIRED` 되돌릴 수 있는 시간이 지남.
            `FOLLOW_UP_CHANGE_EXISTS` 승인 이후 그 날짜 일정이 또 바뀜.
            두 경우 모두 앱은 일정 편집으로 바꿀 수 있음을 안내한다(FR-019)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }

  parameters:
    DetectionId:
      name: detectionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PreviewId:
      name: previewId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReplacementId:
      name: replacementId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 같은 키의 재요청은 첫 처리 결과를 그대로 받는다(constitution III)
      schema: { type: string, minLength: 1, maxLength: 255 }

  schemas:
    CreatePreviewRequest:
      type: object
      required: [placeId, scheduleVersion]
      properties:
        placeId:
          type: string
          description: 대체 장소 식별자. F003 장소 DTO의 `placeId`와 같은 형식(예 `tourapi:123`)
        candidateId:
          type: [string, 'null']
          description: |
            F009 ALT-001이 발급한 후보 식별자. 직접 검색(ALT-002)으로 고른 장소는 null이다.
            값이 오면 서명·만료·감지 결과 일치를 검증한다(FR-004)
        scheduleVersion:
          type: integer
          minimum: 1
          description: 앱이 보고 있는 그 날짜의 일정 version

    ComparisonValue:
      type: object
      required: [before, after]
      description: |
        비교 한 쌍. 값을 확보하지 못하면 해당 쪽이 null이고 앱은 `정보 없음`으로 표시한다
        (FR-002·UI-002). 값을 지어내지 않는다
      properties:
        before: { type: ['number', 'string', 'null'] }
        after: { type: ['number', 'string', 'null'] }

    PreviewComparison:
      type: object
      required: [totalDurationSeconds, totalDistanceMeters, estimatedArrivalAt, closesAt]
      properties:
        totalDurationSeconds:
          allOf: [{ $ref: '#/components/schemas/ComparisonValue' }]
          description: 그 날짜 전체 이동 시간(초)
        totalDistanceMeters:
          allOf: [{ $ref: '#/components/schemas/ComparisonValue' }]
          description: 그 날짜 전체 이동 거리(m)
        estimatedArrivalAt:
          allOf: [{ $ref: '#/components/schemas/ComparisonValue' }]
          description: 바뀌는 장소의 도착 예정 시각(ISO-8601)
        closesAt:
          allOf: [{ $ref: '#/components/schemas/ComparisonValue' }]
          description: 바뀌는 장소의 운영 마감 시각(ISO-8601). 확인할 수 없으면 null

    ReplacedPlace:
      type: object
      required: [placeId, name, category]
      properties:
        placeId: { type: string }
        name: { type: string }
        category: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }

    RoutePreview:
      type: object
      required:
        [previewId, detectionId, tripId, date, itemId, originalPlace, alternativePlace,
         detectionReason, comparison, route, scheduleVersion, expiresAt]
      properties:
        previewId: { type: string, format: uuid }
        detectionId: { type: string, format: uuid }
        tripId: { type: string, format: uuid }
        date: { type: string, format: date }
        itemId:
          type: string
          format: uuid
          description: 바꿀 대상 항목. 승인 전후로 같다(research 3절)
        originalPlace: { $ref: '#/components/schemas/ReplacedPlace' }
        alternativePlace: { $ref: '#/components/schemas/ReplacedPlace' }
        detectionReason:
          type: string
          description: 왜 바꾸는지. F008 감지 결과의 `reason`을 그대로 전달한다(UI-002)
        comparison: { $ref: '#/components/schemas/PreviewComparison' }
        route:
          type: object
          description: |
            변경 후 그 날짜 경로. `routes.route_payload`와 같은 형식이며 F005 ROUTE-001
            응답의 `route`와 호환된다. 지도에 변경 경로를 그리는 데 쓴다(UI-001)
        scheduleVersion:
          type: integer
          description: 미리보기를 만든 시점의 일정 version. 승인 시 이 값으로 충돌을 판정한다
        expiresAt:
          type: string
          format: date-time
          description: 만료 시각. 앱은 표시에만 쓰고 만료 판정은 서버가 한다(FR-005)

    Replacement:
      type: object
      required:
        [replacementId, tripId, date, itemId, originalPlaceId, newPlaceId,
         newPlaceName, originalPlaceName, scheduleVersion, routeStatus, undoExpiresAt]
      properties:
        replacementId: { type: string, format: uuid }
        tripId: { type: string, format: uuid }
        date: { type: string, format: date }
        itemId: { type: string, format: uuid }
        originalPlaceId: { type: string }
        newPlaceId: { type: string }
        newPlaceName:
          type: string
          description: 되돌리기 안내 문구에 쓴다(UI-006)
        originalPlaceName: { type: string }
        scheduleVersion:
          type: integer
          description: 승인으로 오른 일정 version
        routeStatus:
          type: string
          enum: [READY]
          description: |
            승인은 미리보기에서 계산을 마친 경로만 확정하므로 항상 READY다. 계산하지 못한
            상태로는 미리보기 자체가 만들어지지 않는다(research 2절)
        undoExpiresAt:
          type: string
          format: date-time
          description: 되돌릴 수 있는 시각. 승인 시각 + 30초. 만료 판정은 서버 시각으로 한다

    ReplacementUndoResult:
      type: object
      required: [replacementId, restored, scheduleVersion, routeStatus, detectionRestored]
      properties:
        replacementId: { type: string, format: uuid }
        restored:
          type: boolean
          description: 항상 true. 이미 되돌린 변경에 다시 요청해도 true다
        scheduleVersion:
          type: integer
          description: 되돌리기로 오른 일정 version
        routeStatus:
          type: string
          enum: [READY, FAILED]
          description: |
            승인 전 경로를 다시 활성화하므로 보통 READY다. 승인 전 경로가 FAILED였다면
            그 상태가 그대로 복원된다
        detectionRestored:
          type: boolean
          description: |
            감지 결과가 사용자 결정 전 상태로 돌아갔는지(FR-018). 같은 항목에 더 새로운
            감지 결과가 이미 있으면 false이며, 이때도 사용자에게는 그 새 감지 결과가
            배너로 보인다(research 5절)

    UndoableReplacement:
      type: object
      required: [replacementId, itemId, originalPlaceName, newPlaceName, undoExpiresAt]
      description: |
        **F006 PROG-001 응답 확장.** 되돌릴 수 있는 장소 변경이 있으면 실리고 없으면 null이다.
        앱은 이 값으로 진행 화면에 되돌리기를 보인다(UI-006).

        F007 `undoable`(자동 확정 되돌리기)과 동시에 실릴 수 있다. 앱은 남은 시간이 짧은
        이쪽을 먼저 보인다(UI-006a)
      properties:
        replacementId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        originalPlaceName: { type: string }
        newPlaceName: { type: string }
        undoExpiresAt: { type: string, format: date-time }

    ResponseMeta:
      type: object
      required: [requestId]
      properties:
        requestId: { type: string, format: uuid }

    RoutePreviewEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { const: true }
        data: { $ref: '#/components/schemas/RoutePreview' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }

    ReplacementEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { const: true }
        data: { $ref: '#/components/schemas/Replacement' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }

    UndoEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { const: true }
        data: { $ref: '#/components/schemas/ReplacementUndoResult' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: ['object', 'null'] }

    ErrorEnvelope:
      type: object
      required: [success, error, meta]
      properties:
        success: { const: false }
        error: { $ref: '#/components/schemas/Error' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
