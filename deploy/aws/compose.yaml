services:
  api:
    build:
      context: ../../api
    env_file:
      - ${GILPICK_ENV_FILE:-/opt/gilpick/.env}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  caddy:
    image: caddy:2.11.4-alpine
    env_file:
      - ${GILPICK_ENV_FILE:-/opt/gilpick/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
